# Campus presence tracking — system configuration.
#
# Thresholds in this file are the tuning surface. They were chosen against real
# campus footage, and they are deliberately asymmetric: the system is tuned to
# miss a sighting occasionally rather than to attribute a sighting to the wrong
# student. Re-tune with `campus bench` against your own recordings.

detectors:
  model_path: models/scrfd_2.5g.onnx
  device: null                      # null = auto (CUDA if available, else CPU)
  input_size: 640
  score_threshold: 0.5
  nms_threshold: 0.4

  # 640 == input_size, so tiles reach the detector at 1:1 and a face is exactly
  # as many pixels to the detector as it has in the frame. THIS IS THE MOST
  # IMPORTANT SETTING IN THE FILE. At the 4K-oriented value of 1280, a 1080p
  # frame runs at 0.5x, a 20px face arrives as 10px, and the camera silently
  # detects almost nothing. Only raise it for 4K sources.
  tile_size: 640

  # 0.25 -> ~28% of faces sit on a tile seam and are detected twice (deduped by
  # NMS). Proportionally costlier on small frames: 1.58x frame pixels at 1080p,
  # 2.67x at 720p, because a 640px tile is a large fraction of those frames.
  # Drop to 0.125 if a node is GPU-bound; watch `tile_count` telemetry.
  tile_overlap: 0.25
  min_tile_size: 320

embedder:
  model_path: models/glintr100k.onnx
  device: null
  dim: 512
  max_batch: 256

gallery:
  backend: auto                     # faiss if importable, else numpy
  use_gpu: true
  top_k: 5
  rebuild_batch: 5000

worker:
  worker_id: ${CAMPUS_WORKER_ID}    # overridden by env
  redis_url: redis://redis:6379/0
  postgres_dsn: postgresql://campus:campus@postgres:5432/campus
  max_cameras: 32
  publish_interval_s: 1.0
  observation_ttl_s: 300
  stream_backend: nvdec
  jpeg_quality: 3
  on_error: drop_frame

# Quality gate. Applied to every detection before embedding.
# Raising min_face_px is the single most effective latency lever: it drops
# the number of embeddings, which dominates GPU cost.
#
# min_face_px is MEASURED, not estimated. Same-photo queries at reduced
# resolution against a real 358-student gallery:
#
#   actual face px     54     36     27     20    <20
#   top-1 accuracy   100%   100%    80%    33%     0%   (nothing survives)
#
# 24 sits just under the knee. face_px ~= 250/d at 1080p, 167/d at 720p, so
# this is ~10m at 1080p and ~7m at 720p. That range is short, and it is the
# number to argue about when cameras are placed.
quality:
  min_face_px: 24
  min_face_ratio: 0.015
  min_blur_score: 45.0
  # Size-dependent: a clean in-focus face scores 2992 at 20px but only 143 at
  # 400px, because a downscaled crop has more edge per pixel. An earlier bound
  # of 900 sat below the 40px median of 1491 and rejected clean, in-focus
  # long-range faces as "noise" — silently, since a rejected face looks
  # exactly like an empty corridor.
  max_blur_score: 6000.0
  max_yaw_deg: 45.0
  max_pitch_deg: 35.0
  max_roll_deg: 40.0
  min_brightness: 25.0
  max_brightness: 235.0
  min_contrast: 12.0
  max_occlusion_ratio: 0.42

# Temporal verification. The margin is the load-bearing parameter.
verification:
  window: 12
  min_support: 7
  # Below the sibling band on purpose — see campus/temporal/verifier.py
  min_median_score: 0.38
  min_margin: 0.06
  overturn_score: 0.62
  overturn_frames: 5
  min_observations: 5
  max_gap_s: 2.5
  decay_half_life_s: 8.0

purposes:
  - attendance
  - safety

zones:
  default:
    zone: default
    allowed_purposes: [attendance, safety]
    require_consent: true
    retention_days: 30
  # Corridor cameras: needed for safety, identity not retained beyond the shift.
  # This is the zone that makes the system defensible under DPDP — most
  # cameras never need to keep an identity at all.
  corridor:
    zone: corridor
    allowed_purposes: [safety]
    require_consent: true
    retention_days: 7
    anonymise_after_minutes: 60
  library:
    zone: library
    allowed_purposes: [attendance, access_control]
    require_consent: true
    retention_days: 90
